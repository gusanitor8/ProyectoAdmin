filebeat.inputs:
  - type: log
    id: jacks-api-logs
    enabled: true
    paths:
      - /app/logs/api.log
    # Parse JSON logs
    json.keys_under_root: true
    json.overwrite_keys: true
    json.add_error_key: true

processors:
  - add_fields:
      target: ""
      fields:
        service.name: "jacks-cave-api"
        env: "dev"

setup.template.enabled: true
setup.template.name: "jacks-api-logs"
setup.template.pattern: "jacks-api-logs-*"

output.elasticsearch:
  hosts: ["http://elasticsearch:9200"]
  index: "jacks-api-logs-%{+yyyy.MM.dd}"

setup.kibana:
  host: "http://kibana:5601"
