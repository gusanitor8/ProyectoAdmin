services:
  db:
    image: postgres:16
    container_name: jacks_db
    environment:
      POSTGRES_DB: jacks_cave
      POSTGRES_USER: jacks
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - jacks-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jacks -d jacks_cave"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  api:
    build: ./api
    container_name: jacks_api
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://jacks:secret@db:5432/jacks_cave
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/app/logs
    networks:
      - jacks-net

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
    networks:
      - jacks-net
    volumes:
      - es_data:/usr/share/elasticsearch/data

  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.0
    container_name: kibana
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"
    networks:
      - jacks-net
    depends_on:
      - elasticsearch

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.12.0
    container_name: filebeat
    user: root
    volumes:
      - ./elastic/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - ./logs:/app/logs:ro
    networks:
      - jacks-net
    depends_on:
      - elasticsearch
      - api
    command: ["--strict.perms=false"]

  
  heartbeat:
    image: docker.elastic.co/beats/heartbeat:8.12.0
    container_name: heartbeat
    user: root
    volumes:
      - ./elastic/heartbeat.yml:/usr/share/heartbeat/heartbeat.yml:ro
    networks:
      - jacks-net
    depends_on:
      - elasticsearch
    command: ["--strict.perms=false"]

volumes:
  db_data:
  es_data:

networks:
  jacks-net:
    driver: bridge
